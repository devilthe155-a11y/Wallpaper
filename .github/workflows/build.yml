          package com.arpan.xraywallpaper;

          import android.app.ActivityManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.Environment;
          import android.os.StatFs;
          import android.util.DisplayMetrics;
          import android.view.Display;
          import android.view.WindowManager;

          import java.io.BufferedReader;
          import java.io.FileReader;
          import java.util.Locale;

          /** Reads what this phone really reports. Anything Android blocks stays "not readable". */
          final class Telemetry {
              int cores = Math.max(1, Runtime.getRuntime().availableProcessors());

              int batPct = -1;
              float batTempC = Float.NaN;
              float batV = Float.NaN;
              boolean charging;

              long ramTotal;
              long ramFree;
              long stoTotal;
              long stoFree;

              int[] freqKHz = new int[8];
              int maxFreqKHz;
              boolean freqOk;

              float cpuTempC = Float.NaN;
              String cpuTempSrc = "";
              private String thermalPath;
              private boolean thermalScanned;

              String net = "offline";
              int dispW;
              int dispH;
              int dpi;
              float hz = 60f;

              final String hardware = Build.HARDWARE == null ? "" : Build.HARDWARE;
              final String model = Build.MODEL == null ? "" : Build.MODEL;
              final String maker = Build.MANUFACTURER == null ? "" : Build.MANUFACTURER;

              float ax;
              float ay;
              float az;
              boolean accelOk;

              void update(Context c) {
                  try {
                      Intent b = c.registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                      if (b != null) {
                          int lvl = b.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                          int sc = b.getIntExtra(BatteryManager.EXTRA_SCALE, 100);
                          batPct = (lvl >= 0 && sc > 0) ? Math.round(lvl * 100f / sc) : -1;
                          int t = b.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, Integer.MIN_VALUE);
                          batTempC = (t == Integer.MIN_VALUE) ? Float.NaN : t / 10f;
                          int v = b.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 0);
                          batV = v > 0 ? v / 1000f : Float.NaN;
                          int st = b.getIntExtra(BatteryManager.EXTRA_STATUS, -1);
                          charging = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL;
                      }
                  } catch (Exception ignored) {
                  }

                  try {
                      ActivityManager am = (ActivityManager) c.getSystemService(Context.ACTIVITY_SERVICE);
                      ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                      am.getMemoryInfo(mi);
                      ramTotal = mi.totalMem;
                      ramFree = mi.availMem;
                  } catch (Exception ignored) {
                  }

                  try {
                      StatFs s = new StatFs(Environment.getDataDirectory().getPath());
                      stoTotal = s.getTotalBytes();
                      stoFree = s.getAvailableBytes();
                  } catch (Exception ignored) {
                  }

                  readCpu();

                  try {
                      ConnectivityManager cm = (ConnectivityManager) c.getSystemService(Context.CONNECTIVITY_SERVICE);
                      net = "offline";
                      Network n = cm.getActiveNetwork();
                      if (n != null) {
                          NetworkCapabilities nc = cm.getNetworkCapabilities(n);
                          if (nc != null) {
                              if (nc.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)) {
                                  net = "Wi-Fi";
                              } else if (nc.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR)) {
                                  net = "Mobile data";
                              } else {
                                  net = "Connected";
                              }
                          }
                      }
                  } catch (Exception ignored) {
                  }

                  try {
                      WindowManager wm = (WindowManager) c.getSystemService(Context.WINDOW_SERVICE);
                      Display d = wm.getDefaultDisplay();
                      DisplayMetrics dm = new DisplayMetrics();
                      d.getRealMetrics(dm);
                      dispW = dm.widthPixels;
                      dispH = dm.heightPixels;
                      dpi = dm.densityDpi;
                      hz = d.getRefreshRate();
                  } catch (Exception ignored) {
                  }
              }

              private void readCpu() {
                  if (freqKHz.length != cores) {
                      freqKHz = new int[cores];
                  }
                  boolean any = false;
                  for (int i = 0; i < cores; i++) {
                      int f = readInt("/sys/devices/system/cpu/cpu" + i + "/cpufreq/scaling_cur_freq");
                      freqKHz[i] = Math.max(f, 0);
                      if (f > 0) {
                          any = true;
                      }
                  }
                  freqOk = any;
                  if (maxFreqKHz == 0) {
                      for (int i = 0; i < cores; i++) {
                          maxFreqKHz = Math.max(maxFreqKHz, readInt("/sys/devices/system/cpu/cpu" + i + "/cpufreq/cpuinfo_max_freq"));
                      }
                  }

                  if (!thermalScanned) {
                      thermalScanned = true;
                      String fallback = null;
                      String fallbackName = "";
                      for (int z = 0; z < 40 && thermalPath == null; z++) {
                          String base = "/sys/class/thermal/thermal_zone" + z;
                          String type = readLine(base + "/type");
                          int raw = readInt(base + "/temp");
                          if (type == null || raw <= 0) {
                              continue;
                          }
                          float tc = raw > 1000 ? raw / 1000f : raw;
                          if (tc < 10f || tc > 110f) {
                              continue;
                          }
                          String lower = type.toLowerCase(Locale.US);
                          if (lower.contains("cpu") || lower.contains("soc") || lower.contains("cluster")) {
                              thermalPath = base + "/temp";
                              cpuTempSrc = type;
                          } else if (fallback == null) {
                              fallback = base + "/temp";
                              fallbackName = type;
                          }
                      }
                      if (thermalPath == null && fallback != null) {
                          thermalPath = fallback;
                          cpuTempSrc = fallbackName;
                      }
                  }
                  if (thermalPath != null) {
                      int raw = readInt(thermalPath);
                      float tc = raw > 1000 ? raw / 1000f : raw;
                      cpuTempC = (raw > 0 && tc >= 10f && tc <= 110f) ? tc : Float.NaN;
                  }
              }

              float avgFreqRatio() {
                  if (!freqOk || maxFreqKHz <= 0) {
                      return -1f;
                  }
                  float sum = 0f;
                  for (int i = 0; i < cores; i++) {
                      sum += freqKHz[i] / (float) maxFreqKHz;
                  }
                  return Math.min(1f, sum / cores);
              }

              static String gb(long bytes) {
                  return String.format(Locale.US, "%.1f GB", bytes / 1073741824.0);
              }

              /** One line per sensor group, for the setup screen. */
              String diagnostics() {
                  StringBuilder sb = new StringBuilder();
                  sb.append("Phone: ").append(maker).append(' ').append(model).append('\n');
                  sb.append("Chip code: ").append(hardware.isEmpty() ? "not reported" : hardware).append('\n');
                  sb.append("CPU cores: ").append(cores).append('\n');
                  sb.append("CPU speed: ").append(freqOk ? "readable" : "locked by Android").append('\n');
                  sb.append("CPU temperature: ").append(Float.isNaN(cpuTempC) ? "locked by Android"
                          : String.format(Locale.US, "%.1f C (%s)", cpuTempC, cpuTempSrc)).append('\n');
                  sb.append("Battery temperature: ").append(Float.isNaN(batTempC) ? "not reported"
                          : String.format(Locale.US, "%.1f C", batTempC)).append('\n');
                  sb.append("Memory: ").append(ramTotal > 0 ? gb(ramFree) + " free of " + gb(ramTotal) : "not reported").append('\n');
                  sb.append("Storage: ").append(stoTotal > 0 ? gb(stoFree) + " free of " + gb(stoTotal) : "not reported");
                  return sb.toString();
              }

              private static String readLine(String path) {
                  try (BufferedReader r = new BufferedReader(new FileReader(path))) {
                      String s = r.readLine();
                      return s == null ? null : s.trim();
                  } catch (Exception e) {
                      return null;
                  }
              }

              private static int readInt(String path) {
                  String s = readLine(path);
                  if (s == null) {
                      return -1;
                  }
                  try {
                      return Integer.parseInt(s);
                  } catch (Exception e) {
                      return -1;
                  }
              }
          }
