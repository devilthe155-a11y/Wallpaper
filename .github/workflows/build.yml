          package com.arpan.xraywallpaper;

          import android.app.WallpaperManager;
          import android.content.Context;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.service.wallpaper.WallpaperService;
          import android.view.MotionEvent;
          import android.view.SurfaceHolder;

          public class XrayWallpaperService extends WallpaperService {

              @Override
              public Engine onCreateEngine() {
                  return new XrayEngine();
              }

              private class XrayEngine extends Engine implements SensorEventListener {
                  private final Handler handler = new Handler(Looper.getMainLooper());
                  private final Scene scene = new Scene();
                  private final Telemetry tel = new Telemetry();
                  private SensorManager sensors;
                  private Sensor accel;
                  private boolean visible;
                  private long lastTelemetry;
                  private float lastX;
                  private float lastY;
                  private float moved;
                  private long downAt;

                  private final Runnable drawer = new Runnable() {
                      @Override
                      public void run() {
                          drawFrame();
                      }
                  };

                  @Override
                  public void onCreate(SurfaceHolder surfaceHolder) {
                      super.onCreate(surfaceHolder);
                      setTouchEventsEnabled(true);
                      setOffsetNotificationsEnabled(true);
                      sensors = (SensorManager) getSystemService(Context.SENSOR_SERVICE);
                      accel = sensors == null ? null : sensors.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
                  }

                  @Override
                  public void onVisibilityChanged(boolean isVisible) {
                      visible = isVisible;
                      if (isVisible) {
                          if (sensors != null && accel != null) {
                              sensors.registerListener(this, accel, SensorManager.SENSOR_DELAY_UI);
                          }
                          handler.removeCallbacks(drawer);
                          handler.post(drawer);
                      } else {
                          if (sensors != null) {
                              sensors.unregisterListener(this);
                          }
                          handler.removeCallbacks(drawer);
                      }
                  }

                  @Override
                  public void onSurfaceChanged(SurfaceHolder holder, int format, int width, int height) {
                      super.onSurfaceChanged(holder, format, width, height);
                      if (visible) {
                          handler.removeCallbacks(drawer);
                          handler.post(drawer);
                      }
                  }

                  @Override
                  public void onSurfaceDestroyed(SurfaceHolder holder) {
                      visible = false;
                      handler.removeCallbacks(drawer);
                      if (sensors != null) {
                          sensors.unregisterListener(this);
                      }
                      super.onSurfaceDestroyed(holder);
                  }

                  @Override
                  public void onDestroy() {
                      visible = false;
                      handler.removeCallbacks(drawer);
                      if (sensors != null) {
                          sensors.unregisterListener(this);
                      }
                      super.onDestroy();
                  }

                  @Override
                  public void onOffsetsChanged(float xOffset, float yOffset, float xOffsetStep, float yOffsetStep,
                                               int xPixelOffset, int yPixelOffset) {
                      scene.setPage(xOffset);
                  }

                  @Override
                  public void onTouchEvent(MotionEvent e) {
                      switch (e.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              lastX = e.getX();
                              lastY = e.getY();
                              moved = 0f;
                              downAt = e.getEventTime();
                              break;
                          case MotionEvent.ACTION_MOVE: {
                              float dx = e.getX() - lastX;
                              float dy = e.getY() - lastY;
                              scene.drag(dx, dy);
                              moved += Math.abs(dx) + Math.abs(dy);
                              lastX = e.getX();
                              lastY = e.getY();
                              break;
                          }
                          case MotionEvent.ACTION_UP:
                              if (moved < 24f && e.getEventTime() - downAt < 350) {
                                  scene.tap(e.getX(), e.getY());
                              }
                              break;
                          default:
                              break;
                      }
                  }

                  @Override
                  public Bundle onCommand(String action, int x, int y, int z, Bundle extras, boolean resultRequested) {
                      if (WallpaperManager.COMMAND_TAP.equals(action)) {
                          scene.tap(x, y);
                      }
                      return null;
                  }

                  @Override
                  public void onSensorChanged(SensorEvent event) {
                      float ax = event.values[0];
                      float az = event.values[2];
                      tel.ax = ax;
                      tel.ay = event.values[1];
                      tel.az = az;
                      tel.accelOk = true;
                      scene.tiltY = clamp(-ax / 9.81f, -1f, 1f) * 0.6f;
                      scene.tiltX = -clamp((az - 3f) / 9.81f, -1f, 1f) * 0.5f;
                  }

                  @Override
                  public void onAccuracyChanged(Sensor sensor, int accuracy) {
                  }

                  private float clamp(float v, float a, float b) {
                      return Math.max(a, Math.min(b, v));
                  }

                  private void drawFrame() {
                      SurfaceHolder holder = getSurfaceHolder();
                      android.graphics.Canvas c = null;
                      try {
                          c = holder.lockCanvas();
                          if (c != null) {
                              long now = SystemClock.uptimeMillis();
                              if (now - lastTelemetry > 2000) {
                                  tel.update(XrayWallpaperService.this);
                                  lastTelemetry = now;
                              }
                              scene.render(c, c.getWidth(), c.getHeight(), now, tel);
                          }
                      } catch (Exception ignored) {
                      } finally {
                          if (c != null) {
                              try {
                                  holder.unlockCanvasAndPost(c);
                              } catch (Exception ignored) {
                              }
                          }
                      }
                      handler.removeCallbacks(drawer);
                      if (visible) {
                          handler.postDelayed(drawer, 40);
                      }
                  }
              }
          }
